# Push a tag like v1.0.0 → tests run, the app is built for Windows, macOS and
# Linux, and the files are attached to a GitHub Release. The README's download
# links point at /releases/latest/download/<file>, so they always get the newest.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist -- --publish never
            file: dist/MUN-Committee-Sorter-Windows.exe
          - os: macos-latest
            cmd: npm run dist:mac -- --publish never
            file: dist/MUN-Committee-Sorter-Mac.dmg
          - os: ubuntu-latest
            cmd: npm run dist:linux -- --publish never
            file: dist/MUN-Committee-Sorter-Linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Download the file for your computer** — no install needed.

            | Computer | File |
            |---|---|
            | Windows | `MUN-Committee-Sorter-Windows.exe` |
            | Mac | `MUN-Committee-Sorter-Mac.dmg` |
            | Linux | `MUN-Committee-Sorter-Linux.AppImage` |

            Or use it in the browser: https://asuarcia.github.io/MUN-Sorting-Algorithim/
